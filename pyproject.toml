[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "composable-dllms"
version = "0.1.0"
description = "Composable diffusion language models via energy-based Product of Experts"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Bruno Kalfa", email = "bruno@alloreview.com" }]

dependencies = [
    # Bounds are intentionally loose: dllm pins transformers==4.57.0, and
    # tightening here only causes resolution conflicts. Re-tighten if a
    # future regression motivates it.
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "accelerate>=0.30.0",
    "datasets>=2.18.0",
    "tokenizers>=0.15.0",
    "huggingface_hub>=0.23.0",
    "safetensors>=0.4.0",
    # dllm is installed separately by scripts/setup_dllm.sh — see that
    # script for why a plain `pip install git+...` is not enough.
    # Its runtime deps are pinned here because setup_dllm.sh uses
    # --no-deps to avoid version conflicts with our own pins.
    "torchmetrics>=1.0.0",
    "tyro>=0.8.0",
    "omegaconf>=2.3.0",
    "rich>=13.0.0",
    "deepspeed>=0.14.0",
    "sentencepiece>=0.2.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "scikit-learn>=1.3.0",
    "einops>=0.7.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "tqdm>=4.65.0",
    "typer>=0.12.0",
    "wandb>=0.16.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4.0", "pytest>=8.0.0", "pre-commit>=3.7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["scripts*", "artifacts*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: typer.Option/Argument as default is the idiomatic typer pattern.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
