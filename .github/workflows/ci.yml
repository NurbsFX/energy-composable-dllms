name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a previous run of the same branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The full requirements.txt pulls torch / transformers / dllm and would
      # take ~10 min; the unit tests only exercise the numerical helpers, so
      # we install the minimal set here. Each dep below is required by at
      # least one test:
      #   * scikit-learn — KSG MI estimator (src/energies/independence.py)
      #   * pandas       — Brysbaert TSV/XLSX loader (src/energies/proxies.py)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest numpy scipy scikit-learn pandas

      - name: Ruff lint
        run: ruff check src/ scripts/ tests/

      - name: Ruff format check
        run: ruff format --check src/ scripts/ tests/

      - name: Pytest
        run: pytest -q
